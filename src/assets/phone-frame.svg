<svg viewBox="0 0 500 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1f26"/>
      <stop offset="45%" stop-color="#0f141a"/>
      <stop offset="100%" stop-color="#2a2f36"/>
    </linearGradient>
    <linearGradient id="edgeHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glassGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b1320" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="40" y="20" rx="70" ry="70" width="420" height="960" fill="url(#frameGradient)" filter="url(#shadow)"/>
  <rect x="58" y="40" rx="58" ry="58" width="384" height="920" fill="#0b0f14"/>
  <rect x="68" y="92" rx="36" ry="36" width="364" height="830" fill="#0c1117"/>

  <rect x="68" y="92" rx="36" ry="36" width="364" height="830" fill="url(#glassGlow)"/>
  <rect x="74" y="48" rx="50" ry="50" width="352" height="900" fill="none" stroke="url(#edgeHighlight)" stroke-width="6"/>

  <rect x="175" y="52" rx="18" ry="18" width="150" height="34" fill="#050607"/>
  <circle cx="325" cy="69" r="6" fill="#2b6cb0"/>
  <circle cx="155" cy="69" r="4" fill="#11151b"/>

  <rect x="58" y="140" width="10" height="60" rx="5" fill="#22272e"/>
  <rect x="58" y="230" width="10" height="80" rx="5" fill="#22272e"/>
  <rect x="432" y="210" width="10" height="100" rx="5" fill="#22272e"/>
</svg>
